appId: dev.lucio73.yoink
productName: Yoink
copyright: Copyright © 2026 Lucio73

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# yt-dlp, FFmpeg and Deno are fetched on first run into %APPDATA%/Yoink/bin
# rather than bundled, so they update independently of app releases.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

nsis:
  # artifactName is set per target: no macro distinguishes installer from
  # portable in a shared win.artifactName.
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Yoink
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish:
  provider: github
  # Explicit owner/repo: without these electron-builder infers the target from
  # .git/config, and a failed inference throws during publishing.
  owner: Lucio73-collab
  repo: yoink
  releaseType: release

# Filenames are not named here: electron-builder derives them from the
# package.json version, which has no leading "v".
releaseInfo:
  releaseNotes: |
    ## Install

    **Yoink-setup.exe** — installer with Start menu entry and automatic updates.
    **Yoink-portable.exe** — single file, no installation.

    Windows shows a SmartScreen warning because the app is not code-signed.
    Click **More info**, then **Run anyway**.

    First launch downloads yt-dlp, FFmpeg and Deno (~120 MB, once).
